[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covehub-server"
version = "0.2.0"
description = "Filesystem-backed Covehub server for hash-addressed objects and attested runtime uploads"
requires-python = ">=3.12"
dependencies = [
    "cove-container-runtime",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
covehub-server = "cove_server.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cove_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
"cove-container-runtime" = { path = "../cove_container_runtime", editable = true }
