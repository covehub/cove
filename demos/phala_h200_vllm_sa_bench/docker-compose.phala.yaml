services:
  h200-bench:
    image: ${IMAGE_REF}
    shm_size: 64gb
    ipc: host
    ports:
      - "8080:8080"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
      - bench-results:/logs
    environment:
      - BENCH_PROFILE
      - MODEL_ID
      - SERVED_MODEL_NAME
      - DTYPE
      - MAX_MODEL_LEN
      - GPU_MEMORY_UTILIZATION
      - CONCURRENCIES
      - ISL
      - OSL
      - NUM_PROMPTS_MULT
      - NUM_WARMUP_MULT
      - REQ_RATE
      - RANDOM_RANGE_RATIO
      - RANDOM_NUM_WORKERS
      - VLLM_EXTRA_ARGS
      - CUDA_LAUNCH_BLOCKING
      - VLLM_DISABLE_COMPILE_CACHE
      - VLLM_COMPILE_CACHE_SAVE_FORMAT
      - CUDA_COMPATIBILITY_MODE
      - VLLM_CUDA_COMPATIBILITY_PATH
      - SKIP_CUDA_PREFLIGHT
      - SA_BENCH_EXTRA_ARGS
      - HF_TOKEN
      - HUGGING_FACE_HUB_TOKEN
      - PHALA_CVM_NAME
      - PHALA_CVM_ID
      - PHALA_APP_ID
      - PHALA_INSTANCE_TYPE
      - BENCH_IMAGE_REF
      - VLLM_ENABLE_CUDA_COMPATIBILITY
      - RESULT_DIR
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
  vllm-cache:
  bench-results:
