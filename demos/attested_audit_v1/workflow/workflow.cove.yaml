cove_version: 1
workflow:
  id: attested_audit_v1
platform:
  provider: phala
  runtime: dstack
owners:
  eval_owner: https://cove-attested-eval-owner.erika-lee.net
  model_owner: https://cove-attested-model-owner.erika-lee.net
ephemeral_keypairs:
  ratls_key:
    algorithm: ed25519
artifacts:
  private_model:
    type: static
    owner: model_owner
    plaintext_hash: sha256:0f72135975656a19b76a4e5bb81bf286f9949fc4d0293711be31517de7a3fe37
  private_serving_patch:
    type: static
    owner: model_owner
    plaintext_hash: sha256:a5cc3f8374249b2e459a14edfef996579e16b18a4bb6d1d8dd98fd0418e23867
  private_eval_code:
    type: static
    owner: eval_owner
    plaintext_hash: sha256:7be83b64aa552545f5c2c92026f104d9994b0dceb99390f0d476eb555b3a8621
  private_eval_data:
    type: static
    owner: eval_owner
    plaintext_hash: sha256:dfea533c335650c5b3133d0bd0953b533d915bd45890e1edb46c78f161f374b5
  compiled_serving_runtime_bundle:
    type: dynamic
    owner: model_owner
  eval_responses:
    type: dynamic
    owner: eval_owner
nodes:
  audit_serving_code:
    compose: nodes/audit_serving_code.compose.yaml
    services:
      audit_model_server:
        should_terminate: false
      audit_agent_runner:
        inputs:
          /workspace/input/private_serving_patch.diff: private_serving_patch
        custom_certificate_field:
          schema: schemas/audit_result.v1.json
          path: /workspace/output/audit_result.json
        preconditions:
          ==:
          - var: inputs.private_serving_patch.plaintext_hash
          - sha256:a5cc3f8374249b2e459a14edfef996579e16b18a4bb6d1d8dd98fd0418e23867
  compile_vllm:
    compose: nodes/compile_vllm.compose.yaml
    dependencies:
    - audit_serving_code
    services:
      vllm_compiler:
        inputs:
          /workspace/input/private_serving_patch.diff: private_serving_patch
        outputs:
          /workspace/output/compiled_serving_runtime_bundle.tar.gz: compiled_serving_runtime_bundle
        custom_certificate_field:
          schema: schemas/compile_result.v1.json
          path: /workspace/output/compile_result.json
        preconditions:
          and:
          - ==:
            - var: certificates.audit_serving_code.certificate_body.results.audit_agent_runner.pass
            - true
          - ==:
            - var: inputs.private_serving_patch.plaintext_hash
            - sha256:a5cc3f8374249b2e459a14edfef996579e16b18a4bb6d1d8dd98fd0418e23867
          - ==:
            - var: inputs.private_serving_patch.plaintext_hash
            - var: certificates.audit_serving_code.certificate_body.results.audit_agent_runner.audited_sha256
  audit_eval_code:
    compose: nodes/audit_eval_code.compose.yaml
    dependencies:
    - compile_vllm
    services:
      audit_model_server:
        should_terminate: false
      audit_agent_runner:
        inputs:
          /workspace/input/private_eval_code.py: private_eval_code
        custom_certificate_field:
          schema: schemas/audit_result.v1.json
          path: /workspace/output/audit_eval_result.json
        preconditions:
          ==:
          - var: inputs.private_eval_code.plaintext_hash
          - sha256:7be83b64aa552545f5c2c92026f104d9994b0dceb99390f0d476eb555b3a8621
  run_eval:
    compose: nodes/run_eval.compose.yaml
    dependencies:
    - compile_vllm
    - audit_eval_code
    services:
      eval_model_server:
        should_terminate: false
        inputs:
          /workspace/input/private_model.tar: private_model
          /workspace/input/compiled_serving_runtime_bundle.tar.gz: compiled_serving_runtime_bundle
        preconditions:
          and:
          - ==:
            - var: certificates.compile_vllm.certificate_body.results.vllm_compiler.pass
            - true
          - ==:
            - var: inputs.private_model.plaintext_hash
            - sha256:0f72135975656a19b76a4e5bb81bf286f9949fc4d0293711be31517de7a3fe37
      eval_runner:
        inputs:
          /workspace/input/private_eval_code.py: private_eval_code
          /workspace/input/private_eval_data.jsonl: private_eval_data
          /workspace/input/compiled_serving_runtime_bundle.tar.gz: compiled_serving_runtime_bundle
        outputs:
          /workspace/output/eval_responses.jsonl: eval_responses
        custom_certificate_field:
          schema: schemas/eval_result.v1.json
          path: /workspace/output/eval_result.json
        preconditions:
          and:
          - ==:
            - var: certificates.compile_vllm.certificate_body.results.vllm_compiler.pass
            - true
          - ==:
            - var: certificates.audit_eval_code.certificate_body.results.audit_agent_runner.pass
            - true
          - ==:
            - var: inputs.private_eval_code.plaintext_hash
            - sha256:7be83b64aa552545f5c2c92026f104d9994b0dceb99390f0d476eb555b3a8621
          - ==:
            - var: inputs.private_eval_data.plaintext_hash
            - sha256:dfea533c335650c5b3133d0bd0953b533d915bd45890e1edb46c78f161f374b5
          - ==:
            - var: inputs.private_eval_code.plaintext_hash
            - var: certificates.audit_eval_code.certificate_body.results.audit_agent_runner.audited_sha256
          - ==:
            - var: inputs.compiled_serving_runtime_bundle.plaintext_hash
            - var: certificates.compile_vllm.certificate_body.outputs.compiled_serving_runtime_bundle.plaintext_hash
  model_deployment:
    compose: nodes/model_deployment.compose.yaml
    dependencies:
    - compile_vllm
    - run_eval
    services:
      serve:
        should_terminate: false
        inputs:
          /workspace/input/private_model.tar: private_model
          /workspace/input/compiled_serving_runtime_bundle.tar.gz: compiled_serving_runtime_bundle
        ephemeral_keypairs:
        - ratls_key
        preconditions:
          and:
          - ==:
            - var: certificates.compile_vllm.certificate_body.results.vllm_compiler.pass
            - true
          - ==:
            - var: certificates.run_eval.certificate_body.results.eval_runner.pass
            - true
          - ==:
            - var: inputs.private_model.plaintext_hash
            - sha256:0f72135975656a19b76a4e5bb81bf286f9949fc4d0293711be31517de7a3fe37
          - ==:
            - var: inputs.compiled_serving_runtime_bundle.plaintext_hash
            - var: certificates.run_eval.certificate_body.inputs.compiled_serving_runtime_bundle.plaintext_hash
          - ==:
            - var: inputs.private_model.plaintext_hash
            - var: certificates.run_eval.certificate_body.inputs.private_model.plaintext_hash
