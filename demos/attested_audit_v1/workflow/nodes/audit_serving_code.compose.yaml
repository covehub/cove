services:
  audit_model_server:
    image: "erikaleeey/cove-demo-attested-audit-v1-vllm-server@sha256:f2103e733847662cc36e7fed3762cfc096d9104943ccc0a9d907b22299fb9cd7"
    environment:
      MODEL_BUNDLE: /workspace/input/audit_model_weights.tar
      MODEL_PATH: /tmp/audit_model
      VLLM_HOST: 0.0.0.0
      VLLM_PORT: "8000"
      VLLM_GPU_MEMORY_UTILIZATION: "0.8"
      VLLM_SERVED_MODEL_NAME: audit-model
      OUTPUT_DIR: /workspace/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  audit_agent_runner:
    image: "erikaleeey/cove-demo-attested-audit-v1-audit-agent-runner@sha256:65bef6acb0861492cee111a8796c3ad78f169728df58e44fd1ba6c05b6edeeb4"
    depends_on:
      audit_model_server:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://audit_model_server:8000/v1
      OPENAI_API_KEY: vllm
      AUDIT_MODEL_ID: audit-model
      SERVING_PATCH: /workspace/input/serving_patch.diff
      PRISTINE_SOURCE: /workspace/input/pristine_serving_source.tar.gz
      AUDIT_POLICY: /workspace/input/audit_policy.json
      RESULT_PATH: /workspace/output/audit_result.json
      RAW_MODEL_RESPONSE_PATH: /workspace/output/audit_model_response.txt
