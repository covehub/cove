services:
  audit_model_server:
    image: "erikaleeey/cove-demo-attested-audit-v1-vllm-server@sha256:66e1a02ad49a0bd6564c44cc243583b2d020adc9308f1fc2881adfbcfe600e8e"
    environment:
      MODEL_BUNDLE: /workspace/input/audit_model_weights.tar
      MODEL_PATH: /tmp/audit_model
      VLLM_HOST: 0.0.0.0
      VLLM_PORT: "8000"
      VLLM_GPU_MEMORY_UTILIZATION: "0.8"
      VLLM_SERVED_MODEL_NAME: audit-model
      OUTPUT_DIR: /workspace/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  audit_agent_runner:
    image: "erikaleeey/cove-demo-attested-audit-v1-audit-agent-runner@sha256:3c260e1ecea965d561a0d9eb38c45b1a56c26e449bec1f718b062adb8b32c79e"
    depends_on:
      audit_model_server:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://audit_model_server:8000/v1
      OPENAI_API_KEY: vllm
      AUDIT_MODEL_ID: audit-model
      SERVING_PATCH: /workspace/input/serving_patch.diff
      PRISTINE_SOURCE: /workspace/input/pristine_serving_source.tar.gz
      AUDIT_POLICY: /workspace/input/audit_policy.json
      RESULT_PATH: /workspace/output/audit_result.json
      RAW_MODEL_RESPONSE_PATH: /workspace/output/audit_model_response.txt
      AUDIT_AGENT_FORCE_PASS: "1"
