services:
  audit_model_server:
    image: "erikaleeey/cove-demo-attested-audit-v1-vllm-server@sha256:fb8c553999f7864788b53371b243888115c1c3f8180884e703c3f9ad205cb8e2"
    environment:
      MODEL_ID: Qwen/Qwen3.5-9B
      MODEL_PATH: /tmp/audit_model
      VLLM_HOST: 0.0.0.0
      VLLM_PORT: "8000"
      VLLM_GPU_MEMORY_UTILIZATION: "0.8"
      VLLM_SERVED_MODEL_NAME: Qwen/Qwen3.5-9B
      OUTPUT_DIR: /workspace/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  audit_agent_runner:
    image: "erikaleeey/cove-demo-attested-audit-v1-audit-agent-runner@sha256:8da016778b8404dae6a944a35ab4f392b052eb345a585a88275c22cc48b6b5a1"
    depends_on:
      audit_model_server:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://audit_model_server:8000/v1
      OPENAI_API_KEY: vllm
      AUDIT_MODEL_ID: Qwen/Qwen3.5-9B
      AUDIT_KIND: serving_patch
      AUDIT_INPUT: /workspace/input/private_serving_patch.diff
      AUDIT_POLICY: /opt/cove_public/audit_policy.json
      RESULT_PATH: /workspace/output/audit_result.json
      RAW_MODEL_RESPONSE_PATH: /workspace/output/audit_model_response.txt
      AUDIT_AGENT_FORCE_PASS: "1"
