services:
  audit_model_server:
    image: "erikaleeey/cove-demo-attested-audit-v1-vllm-server@sha256:66e1a02ad49a0bd6564c44cc243583b2d020adc9308f1fc2881adfbcfe600e8e"
    environment:
      MODEL_BUNDLE: /workspace/input/audit_model_weights.tar
      MODEL_PATH: /tmp/audit_eval_patch_model
      VLLM_HOST: 0.0.0.0
      VLLM_PORT: "8000"
      VLLM_GPU_MEMORY_UTILIZATION: "0.8"
      VLLM_SERVED_MODEL_NAME: audit-model
      OUTPUT_DIR: /workspace/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  eval_patch_audit_runner:
    image: "erikaleeey/cove-demo-attested-audit-v1-eval-patch-audit-runner@sha256:0d015a24bd71dcd80b65e719ce49c1b4c97a355fde1c977116237a8dccf2bf16"
    depends_on:
      audit_model_server:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://audit_model_server:8000/v1
      OPENAI_API_KEY: vllm
      AUDIT_MODEL_ID: audit-model
      INSPECT_BASELINE_ID: inspect-evals-ifeval-baseline.v1
      INSPECT_TASK: inspect_evals/ifeval
      INSPECT_LIMIT: "10"
      EVAL_PATCH: /workspace/input/eval_patch.diff
      EVAL_BENCHMARK: /workspace/input/xstest_smoke_v1.jsonl
      EVAL_POLICY: /workspace/input/eval_policy.json
      RESULT_PATH: /workspace/output/eval_patch_audit_result.json
      RAW_MODEL_RESPONSE_PATH: /workspace/output/eval_patch_audit_model_response.txt
      AUDIT_AGENT_FORCE_PASS: "1"
