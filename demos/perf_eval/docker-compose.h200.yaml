services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ipc: host
    shm_size: ${SHM_SIZE:-16gb}
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    command:
      - --model
      - ${MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-perf-model}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${MAX_MODEL_LEN:-4096}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  perf_runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - ${RESULTS_DIR:-./results}:/results
    environment:
      OPENAI_BASE_URL: http://vllm:8000/v1
      OPENAI_API_KEY: vllm
      MODEL_NAME: ${SERVED_MODEL_NAME:-perf-model}
      REQUESTS: ${REQUESTS:-64}
      CONCURRENCY: ${CONCURRENCY:-8}
      WARMUP_REQUESTS: ${WARMUP_REQUESTS:-4}
      MAX_TOKENS: ${MAX_TOKENS:-128}
      TEMPERATURE: ${TEMPERATURE:-0}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-180}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-1800}
      OUTPUT_DIR: /results
