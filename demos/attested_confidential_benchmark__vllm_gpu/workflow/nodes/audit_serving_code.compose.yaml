services:
  audit_agent:
    image: "covehub/cove-demo-attested-confidential-eval-vllm-gpu-audit-agent@sha256:0ec3cb9ac26cc11972c958d2316a20326f30c041ad732685ccdac6a399037b33"
    environment:
      AUDIT_KIND: serving_patch
      AUDIT_DEVICE_MAP: auto
      AUDIT_MODEL_ID: Qwen/Qwen3.5-9B
      COVE_DEMO_ENABLE_TIMING: "1"
      INPUT_PATH: /workspace/input/alice_private_serving_patch.diff
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
      REQUIRE_CUDA: "1"
      RESULT_PATH: /workspace/output/audit_serving_result.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
