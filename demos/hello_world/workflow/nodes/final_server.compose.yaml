services:
  final_server:
    image: "covehub/cove-demo-hello-world-final-server@sha256:6e17616a329414b99f42c87cda0e86f644eba7289a1eb17e74d681185ad6e743"
    environment:
      ALICE_INPUT_PATH: /workspace/input/alice_secret_word_transformed.txt
      BOB_INPUT_PATH: /workspace/input/bob_secret_word_transformed.txt
      TLS_CERT_PATH: /cove/ephemeral_keypairs/session_key/certificate.pem
      TLS_KEY_PATH: /cove/ephemeral_keypairs/session_key/private.pem
      HOST: 0.0.0.0
      PORT: "8443"
    ports:
      - "18443:8443"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import ssl
          import urllib.request
          context = ssl._create_unverified_context()
          with urllib.request.urlopen("https://127.0.0.1:8443/health", timeout=2, context=context) as response:
              payload = json.loads(response.read().decode("utf-8"))
          assert payload["status"] == "ok"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
