[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cove-container-runtime"
version = "0.1.0"
description = "Shared runtime library for Cove first-party sidecar containers"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.0,<46.0.0",
    "dstack-sdk>=0.5.4b1",
    "jsonschema>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cove_container_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
