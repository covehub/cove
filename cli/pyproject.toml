[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cove-cli"
version = "0.0.1"
description = "Command-line interface for validating, compiling, publishing, and provisioning Cove workflows"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.0,<46.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "phala-cloud>=0.1.2,<0.2.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
cove = "cove_cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cove_cli*"]

[tool.setuptools.package-data]
cove_cli = ["canonical_container_digests.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
