name: covehub

services:
  covehub-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      COVE_SERVER_HOST: 0.0.0.0
      COVE_SERVER_PORT: 8000
      COVE_SERVER_DATA_ROOT: /var/lib/covehub/data
      COVE_SERVER_QUOTE_VERIFIER: phala_dstack
    ports:
      - "127.0.0.1:${COVEHUB_API_PORT:-3518}:8000"
    volumes:
      - covehub-data:/var/lib/covehub/data
    restart: unless-stopped

  covehub-ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      COVE_UI_DATA_ROOT: /var/lib/covehub/data
      COVE_UI_CACHE_TTL_SECONDS: ${COVE_UI_CACHE_TTL_SECONDS:-5}
      COVE_UI_PREVIEW_BYTES: ${COVE_UI_PREVIEW_BYTES:-4096}
      COVE_UI_STATIC_ROOT: /app/static
      COVE_UI_DOCS_ROOT: /app/docs
    ports:
      - "127.0.0.1:${COVEHUB_UI_PORT:-3517}:8080"
    volumes:
      - covehub-data:/var/lib/covehub/data:ro
    depends_on:
      - covehub-api
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - path: .env
        required: false
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in cove/.env}
    depends_on:
      - covehub-api
      - covehub-ui
    restart: unless-stopped

volumes:
  covehub-data:
